version: 2
suite: run
scenarios:
  - id: R-001
    name: passes
    steps:
      - id: ok
        do: cli.run
        with: { command: ok }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "ok\n" } }

  - id: R-002
    name: fails
    steps:
      - id: no
        do: cli.run
        with: { command: no }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "ok\n" } }

  - id: R-003
    name: its teardown passes, so the fallback isn't needed
    steps:
      - id: leave
        do: cli.run
        with: { command: leave }
        expect: { equal: { $.exit_code: 0 } }
      - id: left
        do: cli.run
        with: { command: state }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "left\n" } }
      - id: clear
        do: cli.run
        with: { command: clear }
        expect: { equal: { $.exit_code: 0 } }
      - id: cleared
        do: cli.run
        with: { command: state }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "clean\n" } }
    cleanup:
      - id: clear-fallback
        unless_passed: clear
        do: cli.run
        with: { command: clear }
        expect: { equal: { $.exit_code: 0 } }

  - id: R-004
    name: fails before its teardown, so the fallback frees what it left
    steps:
      - id: leave
        do: cli.run
        with: { command: leave }
        expect: { equal: { $.exit_code: 0 } }
      - id: left
        do: cli.run
        with: { command: state }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "left\n" } }
      - id: broken
        do: cli.run
        with: { command: no }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "ok\n" } }
      - id: clear
        do: cli.run
        with: { command: clear }
        expect: { equal: { $.exit_code: 0 } }
      - id: cleared
        do: cli.run
        with: { command: state }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "clean\n" } }
    cleanup:
      - id: clear-fallback
        unless_passed: clear
        do: cli.run
        with: { command: clear }
        expect: { equal: { $.exit_code: 0 } }

  - id: R-005
    name: passes but leaves state behind
    steps:
      - id: leave
        do: cli.run
        with: { command: leave }
        expect: { equal: { $.exit_code: 0 } }
      - id: left
        do: cli.run
        with: { command: state }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "left\n" } }

  - id: R-006
    name: runs in the environment R-005 left, and clears it
    steps:
      - id: clear
        do: cli.run
        with: { command: clear }
        expect: { equal: { $.exit_code: 0 } }
      - id: cleared
        do: cli.run
        with: { command: state }
        expect: { equal: { $.exit_code: 0, $.stdout_text: "clean\n" } }
