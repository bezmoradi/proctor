# Written by Claude and accepted by the product owner for the testing phase
# (2026-11-14). Revision 2: the create and the delete are verification steps
# (FIX-08) and names carry ${run.id} (FIX-05). Behavior it doesn't cover yet:
# what happens to `email`.
version: 1
suite: users
scenarios:
  - id: USR-001
    name: A created user can be read back
    steps:
      - id: create
        request:
          method: POST
          path: /api/v1/users
          identity: anonymous
          body:
            name: Ada ${run.id}
        expect:
          status: 201
          present: [$.data]
        save:
          user_id: $.data
      - id: read
        request:
          method: GET
          path: /api/v1/users/${user_id}
          identity: anonymous
        expect:
          status: 200
          keys:
            $.data: [id, name]
          json:
            $.data.id: "${user_id}"
            $.data.name: Ada ${run.id}

  - id: USR-002
    name: A user can't be created without a name
    steps:
      - id: create-without-name
        request:
          method: POST
          path: /api/v1/users
          identity: anonymous
          body: {}
        no_state_check: the in-memory example can't look a user up by name; users-api-postgres checks the table in PGU-002
        expect:
          status: 422
          json:
            $.error: Validation failed

  - id: USR-003
    name: Reading a user that doesn't exist returns 404
    steps:
      - id: read-unknown
        request:
          method: GET
          path: /api/v1/users/does-not-exist
          identity: anonymous
        expect:
          status: 404
          json:
            $.error: Not found

  - id: USR-004
    name: Renaming a user changes the name that is read back
    setup:
      - id: create
        request:
          method: POST
          path: /api/v1/users
          identity: anonymous
          body:
            name: Ada ${run.id}
        expect:
          status: 201
        save:
          user_id: $.data
    steps:
      - id: rename
        request:
          method: PUT
          path: /api/v1/users/${user_id}
          identity: anonymous
          body:
            name: Grace ${run.id}
        expect:
          status: 200
          json:
            $.data.name: Grace ${run.id}
      - id: read
        request:
          method: GET
          path: /api/v1/users/${user_id}
          identity: anonymous
        expect:
          status: 200
          json:
            $.data.name: Grace ${run.id}

  - id: USR-005
    name: A deleted user can no longer be read
    setup:
      - id: create
        request:
          method: POST
          path: /api/v1/users
          identity: anonymous
          body:
            name: Ada ${run.id}
        expect:
          status: 201
        save:
          user_id: $.data
    steps:
      - id: delete
        request:
          method: DELETE
          path: /api/v1/users/${user_id}
          identity: anonymous
        expect:
          status: 200
          present: [$.message]
      - id: read-deleted
        request:
          method: GET
          path: /api/v1/users/${user_id}
          identity: anonymous
        expect:
          status: 404
