version: 2
project: sample
manifest: manifest.yaml
drivers:
  http: { official: http }
  db:
    official: postgres
    policy:
      connections:
        app: { schemas: [public], objects: [users] }
  otel: { official: otel }
  kafka:
    program: examples/sample/proctor/drivers/kafka/bin/proctor-driver-kafka
    sha256:
      linux/amd64: ad7051d1e1c170e833e7633d5b545541e80e952f9000ca53a090a37fe0940474
      darwin/arm64: a2cea70d4afb53be88b0279ab3cc837ee2b90a243c785f2d9dcd155521583ba8
    operations: { events: observe }
    policy:
      topics: { users: sample-users }
identities:
  admin: { type: bearer }
  anonymous: { type: none }
relations:
  - act: { driver: http, target: /api/v1/users }
    shows:
      - { driver: db, target: app }
  - act: { driver: http, target: "/api/v1/users/{}" }
    shows:
      - { driver: db, target: app }
app_logs:
  levels: [ERROR, FATAL, PANIC]
transcripts:
  scrub:
    - { name: date, path: "$.headers.date", numbered: false }
    - { name: date_parts, path: "$.header_lists.date", numbered: false }
mutation:
  mutants: mutants.yaml
  up: env/mutant-up.sh
  down: env/mutant-down.sh
  binding: /tmp/proctor-sample-mutant/binding.yaml
