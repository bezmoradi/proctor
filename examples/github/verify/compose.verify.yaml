name: proctor-verify

services:
  app:
    image: ${APP_IMAGE:?the trusted job sets APP_IMAGE to the image it loaded and checked by digest}
    pull_policy: never
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      DATABASE_URL: postgres://app@db:5432/app?sslmode=disable
      OIDC_ISSUER: http://idp:8080/proctor
    depends_on:
      db:
        condition: service_healthy
      idp:
        condition: service_started

  db:
    image: postgres:17@sha256:<digest>
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 2s
      timeout: 2s
      retries: 30

  idp:
    image: ghcr.io/navikt/mock-oauth2-server:<version>@sha256:<digest>
    environment:
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:18090:8080"
