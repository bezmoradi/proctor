# Generated by mutation-testing/matrix_specs.py for the gopamin combination
# matrix (testing phase, 2026-11-14). The same users-API contract for every
# combination; only the parts that differ between combinations vary.
version: 1
suite: users
scenarios:
  - id: M06-001
    name: A created user can be read back
    steps:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect:
          status: 201
          keys:
            $: [message, data]
          json:
            $.message: Created user successfully
        save: { user_id: $.data }
      - id: read
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          headers:
            Content-Type: application/json
          json:
            $: { message: Fetched user successfully, data: { id: "${user_id}", name: "Ada ${run.id}" } }

  - id: M06-002
    name: A user can't be created with an empty name
    steps:
      - id: create-empty
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "" } }
        no_state_check: Proctor has no Cassandra adapter, and a refused create returns no ID to read back
        expect:
          status: 422
          json:
            $: { message: name is required, error: Validation failed }

  - id: M06-003
    name: Reading a user that doesn't exist returns 404
    steps:
      - id: read-unknown
        request: { method: GET, path: /api/v1/users/00000000-0000-4000-8000-000000000000, identity: admin }
        expect:
          status: 404
          json:
            $: { error: Not found }

  - id: M06-004
    name: A rename is returned and persisted
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: rename
        request: { method: PUT, path: "/api/v1/users/${user_id}", identity: admin, body: { name: "Grace ${run.id}" } }
        expect:
          status: 200
          json:
            $: { message: User updated successfully, data: { id: "${user_id}", name: "Grace ${run.id}" } }
      - id: stored
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: Fetched user successfully, data: { id: "${user_id}", name: "Grace ${run.id}" } }
      - id: read
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          headers:
            Content-Type: application/json
          json:
            $: { message: Fetched user successfully, data: { id: "${user_id}", name: "Grace ${run.id}" } }

  - id: M06-005
    name: A deleted user is gone
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: delete
        request: { method: DELETE, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: "deleted user with ID of ${user_id} successfully" }
      - id: read-deleted
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 404
          json:
            $: { error: Not found }

  - id: M06-006
    name: Renaming one user leaves another unchanged
    setup:
      - id: create-a
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { a_id: $.data }
      - id: create-b
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Bob ${run.id}" } }
        expect: { status: 201 }
        save: { b_id: $.data }
    steps:
      - id: rename-a
        request: { method: PUT, path: "/api/v1/users/${a_id}", identity: admin, body: { name: "Grace ${run.id}" } }
        expect:
          status: 200
          present: [$.data]
      - id: b-unchanged
        request: { method: GET, path: "/api/v1/users/${b_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: Fetched user successfully, data: { id: "${b_id}", name: "Bob ${run.id}" } }

  - id: M06-007
    name: A list page holds exactly the requested number of users, each with only id and name
    setup:
      - id: create-a
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
      - id: create-b
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Bob ${run.id}" } }
        expect: { status: 201 }
    steps:
      - id: first-page
        request: { method: GET, path: /api/v1/users, identity: admin, query: { limit: "1" } }
        expect:
          status: 200
          keys:
            $: [message, data, next_cursor]
            $.data[0]: [id, name]
          length:
            $.data: 1
          json:
            $.message: Fetched users successfully

  - id: M06-008
    name: Listing users without a token is refused
    steps:
      - id: list-anonymous
        request: { method: GET, path: /api/v1/users, identity: anonymous }
        expect:
          status: 401
          json:
            $: { error: unauthorized }

  - id: M06-009
    name: An expired admin token is refused
    steps:
      - id: list-expired
        request: { method: GET, path: /api/v1/users, identity: admin, credential: expired }
        expect:
          status: 401
          json:
            $: { error: unauthorized }

  - id: M06-010
    name: An anonymous delete is refused and the user still exists
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: delete-anonymous
        request: { method: DELETE, path: "/api/v1/users/${user_id}", identity: anonymous }
        expect:
          status: 401
          json:
            $: { error: unauthorized }
      - id: still-there
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: Fetched user successfully, data: { id: "${user_id}", name: "Ada ${run.id}" } }
