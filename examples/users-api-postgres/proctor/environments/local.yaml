# Local mode only. Tokens and the connection string come from environment
# variables; see examples/README.md.
target:
  base_url: http://127.0.0.1:18081
  user_agent: proctor-example/0.0
identities:
  admin:
    token_env: PROCTOR_ADMIN_TOKEN
    variants:
      expired: { token_env: PROCTOR_ADMIN_EXPIRED_TOKEN }
      no_expiry: { token_env: PROCTOR_ADMIN_NO_EXPIRY_TOKEN }
      invalid_signature: { token_env: PROCTOR_ADMIN_BAD_SIGNATURE_TOKEN }
      wrong_audience: { token_env: PROCTOR_ADMIN_WRONG_AUDIENCE_TOKEN }
      wrong_issuer: { token_env: PROCTOR_ADMIN_WRONG_ISSUER_TOKEN }
      unsigned: { token_env: PROCTOR_ADMIN_UNSIGNED_TOKEN }
      malformed: { token_env: PROCTOR_ADMIN_MALFORMED_TOKEN }
      lowercase_scheme: { header_env: PROCTOR_ADMIN_LOWERCASE_AUTH }
secrets:
  admin_password: { env: PROCTOR_ADMIN_PASSWORD }
connections:
  postgres:
    app: { dsn_env: PROCTOR_APP_DB_DSN }
