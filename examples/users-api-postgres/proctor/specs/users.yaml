  - id: PGU-020
    name: A name of exactly 100 characters is accepted and stored whole
    steps:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa${run.id}" } }
        expect:
          status: 201
          keys:
            $: [message, data]
          json:
            $.message: Created user successfully
        save: { user_id: $.data }
      - id: stored
        verify:
          postgres:
            connection: app
            query: SELECT name, char_length(name) AS length FROM users WHERE id = $1
            args: ["${user_id}"]
            expect:
              rows: 1
              first_row: { name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa${run.id}", length: 100 }

  - id: PGU-021
    name: A name of 101 characters is refused, and nothing is stored
    steps:
      - id: create-too-long
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa${run.id}" } }
        expect:
          status: 422
          json:
            $: { message: name is too long, error: Validation failed }
      - id: nothing-stored
        verify:
          postgres:
            connection: app
            query: SELECT count(*) AS n FROM users WHERE name IN ($1)
            args: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa${run.id}"]
            expect:
              first_row: { n: 0 }

  - id: PGU-022
    name: Spaces around a name are kept as sent
    steps:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "  Ada ${run.id}  " } }
        expect:
          status: 201
          json:
            $.message: Created user successfully
        save: { user_id: $.data }
      - id: stored
        verify:
          postgres:
            connection: app
            query: SELECT name FROM users WHERE id = $1
            args: ["${user_id}"]
            expect:
              rows: 1
              first_row: { name: "  Ada ${run.id}  " }
      - id: read
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: Fetched user successfully, data: { id: "${user_id}", name: "  Ada ${run.id}  " } }

  - id: PGU-023
    name: Names with a newline or a tab are refused, and nothing is stored
    steps:
      - id: create-newline
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Line1\nLine2 ${run.id}" } }
        expect:
          status: 422
          json:
            $: { message: name contains invalid characters, error: Validation failed }
      - id: create-tab
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Tab\there ${run.id}" } }
        expect:
          status: 422
          json:
            $: { message: name contains invalid characters, error: Validation failed }
      - id: nothing-stored
        verify:
          postgres:
            connection: app
            query: SELECT count(*) AS n FROM users WHERE name IN ($1, $2)
            args: ["Line1\nLine2 ${run.id}", "Tab\there ${run.id}"]
            expect:
              first_row: { n: 0 }

  - id: PGU-024
    name: Pages follow ascending ID order, and the cursor continues after the last item
    setup:
      - id: create-a
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
      - id: create-b
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Bob ${run.id}" } }
        expect: { status: 201 }
      - id: create-c
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Cy ${run.id}" } }
        expect: { status: 201 }
    steps:
      - id: first-two-ids
        verify:
          postgres:
            connection: app
            query: SELECT (SELECT id::text FROM users ORDER BY users.id LIMIT 1) AS first, (SELECT id::text FROM users ORDER BY users.id OFFSET 1 LIMIT 1) AS second
            expect: { rows: 1 }
        save: { first: first, second: second }
      - id: page-1
        request: { method: GET, path: /api/v1/users, identity: admin, query: { limit: "1" } }
        expect:
          status: 200
          length:
            $.data: 1
          keys:
            $: [message, data, next_cursor]
          json:
            $.data[0].id: "${first}"
        save: { cursor: $.next_cursor }
      - id: page-2
        request: { method: GET, path: /api/v1/users, identity: admin, query: { limit: "1", cursor: "${cursor}" } }
        expect:
          status: 200
          length:
            $.data: 1
          json:
            $.data[0].id: "${second}"

  - id: PGU-025
    name: A page that reaches the end of the list has no next cursor
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
    steps:
      - id: count
        verify:
          postgres:
            connection: app
            query: SELECT count(*) AS n FROM users
            expect: { rows: 1 }
        save: { n: n }
      - id: whole-list
        request: { method: GET, path: /api/v1/users, identity: admin, query: { limit: "${n}" } }
        expect:
          status: 200
          length:
            $.data: "${n}"
          absent: [$.next_cursor]
          keys:
            $: [message, data]

