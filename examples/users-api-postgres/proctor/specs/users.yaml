        expect:
          status: 401
          headers:
            Www-Authenticate: Bearer realm="users-api-postgres", error="invalid_token"
          json:
            $: { error: unauthorized }

  - id: PGU-011
    name: An anonymous delete is refused and the user still exists
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: delete-anonymous
        request: { method: DELETE, path: "/api/v1/users/${user_id}", identity: anonymous }
        expect:
          status: 401
          json:
            $: { error: unauthorized }
      - id: still-stored
        verify:
          postgres:
            connection: app
            query: SELECT name FROM users WHERE id = $1
            args: ["${user_id}"]
            expect:
              rows: 1
              first_row: { name: "Ada ${run.id}" }
      - id: still-there
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: Fetched user successfully, data: { id: "${user_id}", name: "Ada ${run.id}" } }

  - id: PGU-012
    name: PATCH is not supported on a user, and changes nothing
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: patch
        request: { method: PATCH, path: "/api/v1/users/${user_id}", identity: admin, body: { name: "Zed ${run.id}" } }
        expect: { status: 405 }
      - id: unchanged
        verify:
          postgres:
            connection: app
            query: SELECT name FROM users WHERE id = $1
            args: ["${user_id}"]
            expect:
              rows: 1
              first_row: { name: "Ada ${run.id}" }

  - id: PGU-013
    name: An admin token for another audience is refused
    steps:
      - id: list-wrong-audience
        request: { method: GET, path: /api/v1/users, identity: admin, credential: wrong_audience }
        expect:
          status: 401
