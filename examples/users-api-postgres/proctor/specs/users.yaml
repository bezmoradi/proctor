        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "User 21 ${run.id}" } }
        expect: { status: 201 }
    steps:
      - id: expected-size
        verify:
          postgres:
            connection: app
            query: SELECT LEAST(count(*), 100) AS n FROM users
            expect: { rows: 1 }
        save: { n: n }
      - id: over-cap
        request: { method: GET, path: /api/v1/users, identity: admin, query: { limit: "150" } }
        expect:
          status: 200
          length:
            $.data: "${n}"
          json:
            $.message: Fetched users successfully

  - id: PGU-027
    name: A cursor that isn't valid is a client error
    steps:
      - id: not-base64
        request: { method: GET, path: /api/v1/users, identity: admin, query: { cursor: "!!!x" } }
        expect:
          status: 400
          json:
            $: { error: Invalid pagination cursor }
      - id: not-an-id
        request: { method: GET, path: /api/v1/users, identity: admin, query: { cursor: YWJj } }
        expect:
          status: 400
          json:
            $: { error: Invalid pagination cursor }

  - id: PGU-028
    name: Deleting a user that doesn't exist returns 404
    steps:
