        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "User 7 ${run.id}" } }
        expect: { status: 201 }
      - id: create-08
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "User 8 ${run.id}" } }
        expect: { status: 201 }
      - id: create-09
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "User 9 ${run.id}" } }
        expect: { status: 201 }
