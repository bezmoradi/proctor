# Written by Claude for the testing phase (2026-11-14); accepted under the
# product owner's testing-phase rule. Revision 2, after mutation round 1:
# every response body is asserted whole or by its exact key set, every write
# and every refused write is followed by a database check, created names
# carry ${run.id}, and invalid tokens are credential variants of admin.
version: 1
suite: users
scenarios:
  - id: PGU-001
    name: A created user is stored once and can be read back
    steps:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect:
          status: 201
          headers:
            Content-Type: application/json
          keys:
            $: [message, data]
          json:
            $.message: Created user successfully
        save: { user_id: $.data }
      - id: stored
        verify:
          postgres:
            connection: app
            query: SELECT id::text AS id, name FROM users WHERE id = $1
            args: ["${user_id}"]
            expect:
              rows: 1
              first_row: { id: "${user_id}", name: "Ada ${run.id}" }
      - id: stored-once
        verify:
          postgres:
            connection: app
            query: SELECT count(*) AS n FROM users WHERE name = $1
            args: ["Ada ${run.id}"]
            expect:
              first_row: { n: 1 }
      - id: read
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          headers:
            Content-Type: application/json
          json:
            $: { message: Fetched user successfully, data: { id: "${user_id}", name: "Ada ${run.id}" } }

  - id: PGU-002
    name: A user can't be created with an empty name, and nothing is stored
    steps:
      - id: create-empty
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "" } }
        expect:
          status: 422
          json:
            $: { message: name is required, error: Validation failed }
      - id: nothing-stored
        verify:
          postgres:
            connection: app
            query: SELECT count(*) AS n FROM users WHERE name = ''
            expect:
              first_row: { n: 0 }

  - id: PGU-003
    name: Reading a user that doesn't exist returns 404
    steps:
      - id: read-unknown
        request: { method: GET, path: /api/v1/users/2000000000, identity: admin }
        expect:
          status: 404
          json:
            $: { error: Not found }

  - id: PGU-004
    name: A rename is returned and persisted
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: rename
        request: { method: PUT, path: "/api/v1/users/${user_id}", identity: admin, body: { name: "Grace ${run.id}" } }
        expect:
          status: 200
          json:
            $: { message: User updated successfully, data: { id: "${user_id}", name: "Grace ${run.id}" } }
      - id: stored
        verify:
          postgres:
            connection: app
            query: SELECT id::text AS id, name FROM users WHERE id = $1
            args: ["${user_id}"]
            expect:
              rows: 1
              first_row: { id: "${user_id}", name: "Grace ${run.id}" }
      - id: read
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: Fetched user successfully, data: { id: "${user_id}", name: "Grace ${run.id}" } }

  - id: PGU-005
    name: A deleted user is gone from the API and the database
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: delete
        request: { method: DELETE, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: "deleted user with ID of ${user_id} successfully" }
      - id: gone-from-database
        verify:
          postgres:
            connection: app
            query: SELECT id FROM users WHERE id = $1
            args: ["${user_id}"]
            expect: { rows: 0 }
      - id: read-deleted
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 404
          json:
            $: { error: Not found }

  - id: PGU-006
    name: Renaming one user leaves another unchanged
    setup:
      - id: create-a
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { a_id: $.data }
      - id: create-b
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Bob ${run.id}" } }
        expect: { status: 201 }
        save: { b_id: $.data }
    steps:
      - id: rename-a
        request: { method: PUT, path: "/api/v1/users/${a_id}", identity: admin, body: { name: "Grace ${run.id}" } }
        expect:
          status: 200
          json:
            $: { message: User updated successfully, data: { id: "${a_id}", name: "Grace ${run.id}" } }
      - id: only-a-renamed
        verify:
          postgres:
            connection: app
            query: SELECT count(*) AS n FROM users WHERE name = $1
            args: ["Grace ${run.id}"]
            expect:
              first_row: { n: 1 }
      - id: b-stored-unchanged
        verify:
          postgres:
            connection: app
            query: SELECT name FROM users WHERE id = $1
            args: ["${b_id}"]
            expect:
              rows: 1
              first_row: { name: "Bob ${run.id}" }
      - id: read-b
        request: { method: GET, path: "/api/v1/users/${b_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: Fetched user successfully, data: { id: "${b_id}", name: "Bob ${run.id}" } }

  - id: PGU-007
    name: Deleting one user leaves another in place
    setup:
      - id: create-a
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Ada ${run.id}" } }
        expect: { status: 201 }
        save: { a_id: $.data }
      - id: create-b
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "Bob ${run.id}" } }
        expect: { status: 201 }
        save: { b_id: $.data }
    steps:
      - id: delete-a
        request: { method: DELETE, path: "/api/v1/users/${a_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: "deleted user with ID of ${a_id} successfully" }
      - id: a-gone-b-kept
        verify:
          postgres:
            connection: app
            query: SELECT id::text AS id, name FROM users WHERE id IN ($1, $2) ORDER BY id
            args: ["${a_id}", "${b_id}"]
            expect:
              rows: 1
              first_row: { id: "${b_id}", name: "Bob ${run.id}" }
      - id: read-b
        request: { method: GET, path: "/api/v1/users/${b_id}", identity: admin }
        expect:
          status: 200
          json:
            $: { message: Fetched user successfully, data: { id: "${b_id}", name: "Bob ${run.id}" } }

  - id: PGU-008
    name: Listing users without a token is refused
    steps:
      - id: list-anonymous
        request: { method: GET, path: /api/v1/users, identity: anonymous }
        expect:
          status: 401
          headers:
            Www-Authenticate: Bearer realm="users-api-postgres"
          json:
            $: { error: unauthorized }

  - id: PGU-009
    name: An expired admin token is refused
    steps:
      - id: list-expired
        request: { method: GET, path: /api/v1/users, identity: admin, credential: expired }
        expect:
          status: 401
          json:
            $: { error: unauthorized }

