# Proctor's own tests: vet, formatting, and the black-box suite against a
# disposable PostgreSQL server with a password generated for this run (the
# tests check that a wrong password is refused, so trust auth won't do).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start PostgreSQL
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          docker run -d --name pg -e POSTGRES_PASSWORD="$pw" -p 127.0.0.1:5432:5432 \
            postgres:17@sha256:846a7ddaa67a4b354ae1d21087b683901aa6113a4ed626d3787cfbf6c85e3e07
          until docker exec pg pg_isready -U postgres -q; do sleep 1; done
          echo "PROCTOR_E2E_POSTGRES_DSN=postgres://postgres:$pw@127.0.0.1:5432/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal e2e)"
      - run: go test -count=1 ./...
