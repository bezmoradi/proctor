name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOLANGCI_LINT_VERSION: v2.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            echo "::error::gofmt would change these files; run gofmt -w on them."
            exit 1
          fi
      - name: Vet and build each module on its own
        run: |
          failed=
          for m in protocol drivers/* simulators/* examples/sample examples/sample/proctor/drivers/kafka; do
            (cd "$m" && GOWORK=off go vet ./... && GOWORK=off go build -o /dev/null ./...) || failed="$failed $m"
          done
          if [ -n "$failed" ]; then
            echo "::error::go vet or go build failed with GOWORK=off in:$failed"
            exit 1
          fi
      - name: Lint each module
        run: |
          root=$PWD
          failed=
          for m in . protocol drivers/* simulators/* examples/sample examples/sample/proctor/drivers/kafka; do
            echo "golangci-lint: $m"
            (cd "$m" && GOWORK=off go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION" run --config "$root/.golangci.yml" ./...) || failed="$failed $m"
          done
          if [ -n "$failed" ]; then
            echo "::error::golangci-lint failed in:$failed"
            exit 1
          fi

  architecture:
    name: Architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Check the import rules
        run: sh scripts/check-arch.sh

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build proctor, its drivers and the simulators
        run: scripts/build.sh "$RUNNER_TEMP/proctor"
      - name: Run proctor version and list its features
        run: |
          "$RUNNER_TEMP/proctor/proctor" version
          features=$("$RUNNER_TEMP/proctor/proctor" version --features)
          printf '%s\n' "$features"
          if [ -z "$features" ]; then
            echo "::error::proctor version --features listed no features."
            exit 1
          fi
      - name: The build leaves the tree as it was
        run: |
          changed=$(git status --porcelain --untracked-files=all)
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "::error::scripts/build.sh changed or added files in the checkout."
            exit 1
          fi

  sample:
    name: Sample end to end
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PROCTOR_NO_UPDATE_CHECK: "1"
      SAMPLE_DB_DSN: postgres://proctor_reader@127.0.0.1:15480/sample?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build proctor, its drivers and the simulators
        run: scripts/build.sh "$RUNNER_TEMP/proctor"
      - name: proctor init in a new repository, then proctor validate
        run: |
          mkdir "$RUNNER_TEMP/init-check"
          cd "$RUNNER_TEMP/init-check"
          git init -q
          "$RUNNER_TEMP/proctor/proctor" init
          "$RUNNER_TEMP/proctor/proctor" validate
      - name: Build the sample's repository driver
        working-directory: examples/sample/proctor/drivers/kafka
        run: |
          GOWORK=off GOTOOLCHAIN=go1.27.4 CGO_ENABLED=0 GOFLAGS=-mod=readonly GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false -o bin/proctor-driver-kafka ./cmd/proctor-driver-kafka
          shasum -a 256 bin/proctor-driver-kafka
      - name: Start the sample's stack
        run: docker compose -f examples/sample/compose.yaml up -d --build --wait
      - name: proctor validate
        run: '"$RUNNER_TEMP/proctor/proctor" validate -c examples/sample/proctor/proctor.yaml'
      - name: proctor run
        run: |
          SAMPLE_TOKEN=$(curl -fsS --retry 10 --retry-all-errors --retry-delay 1 -X POST http://127.0.0.1:18480/login \
            -H 'Content-Type: application/json' -d '{"username":"admin","password":"sample-demo-password"}' |
            sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          if [ -z "$SAMPLE_TOKEN" ]; then
            echo "::error::POST /login returned no token."
            exit 1
          fi
          echo "::add-mask::$SAMPLE_TOKEN"
          export SAMPLE_TOKEN
          "$RUNNER_TEMP/proctor/proctor" run -c examples/sample/proctor/proctor.yaml \
            --binding examples/sample/proctor/environments/local.yaml --report "$RUNNER_TEMP/sample-report.json"
      - name: The repository driver ran pinned
        run: |
          origin=$(jq -r '.drivers[] | select(.name == "kafka") | .origin' "$RUNNER_TEMP/sample-report.json")
          if [ "$origin" != repository ]; then
            echo "::error::The kafka driver's origin is \"$origin\", not repository: its pin in examples/sample/proctor/proctor.yaml doesn't hold for linux/amd64."
            exit 1
          fi
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-report
          path: ${{ runner.temp }}/sample-report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Show the stack's logs
        if: failure()
        run: docker compose -f examples/sample/compose.yaml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f examples/sample/compose.yaml down -v --rmi local

  cross-build:
    name: Cross-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build and vet every module for each release platform
        run: |
          failed=
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            for m in . protocol drivers/* simulators/* examples/sample examples/sample/proctor/drivers/kafka; do
              echo "cross-build: $t $m"
              (cd "$m" && export GOOS="${t%/*}" GOARCH="${t#*/}" CGO_ENABLED=0 GOWORK=off && go build -o /dev/null ./... && go vet ./...) || failed="$failed $t:$m"
            done
          done
          if [ -n "$failed" ]; then
            echo "::error::Cross-builds failed for:$failed"
            exit 1
          fi

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOVULNCHECK_VERSION: v1.9.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck each module
        run: |
          failed=
          for m in . protocol drivers/* simulators/* examples/sample examples/sample/proctor/drivers/kafka; do
            echo "govulncheck: $m"
            (cd "$m" && GOWORK=off go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...) || failed="$failed $m"
          done
          if [ -n "$failed" ]; then
            echo "::error::govulncheck found vulnerabilities the code reaches in:$failed"
            exit 1
          fi

  no-comments:
    name: No comments
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No Go comments except tool directives
        run: |
          found=$(grep -rnE '^\s*//' --include='*.go' . | grep -vE '//(go:|nolint)' || true)
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Go code holds comments; CLAUDE.md allows only //go: and //nolint directives."
            exit 1
          fi

  no-tests:
    name: No tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No test files or testdata
        run: |
          found=$(find . \( -name '*_test.go' -o -name testdata \) -not -path './.git/*')
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::CLAUDE.md allows no *_test.go files and no testdata."
            exit 1
          fi

  files:
    name: Files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/check-files.sh

  spelling:
    name: Spelling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install typos
        env:
          VERSION: 1.52.0
          SHA256: 6155d4114f9a0f5b8f6d4fda96266c9d5f6add71df80da7f684ee5e72eb14588
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/typos.tar.gz" "https://github.com/crate-ci/typos/releases/download/v$VERSION/typos-v$VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/typos.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/typos"
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP/typos" ./typos
      - run: git ls-files -z | xargs -0 "$RUNNER_TEMP/typos/typos" --config .typos.toml

  workflows:
    name: Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_IMAGE: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm --network none -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE"
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo "$ZIZMOR_IMAGE" --strict-collection --no-progress --color never .github

  shell:
    name: Shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SHELLCHECK_IMAGE: docker.io/koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 docker run --rm --network none -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -S warning

  markdown:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MARKDOWNLINT_IMAGE: docker.io/davidanson/markdownlint-cli2:v0.18.1@sha256:173cb697a255a8a985f2c6a83b4f7a8b3c98f4fb382c71c45f1c52e4d4fed63a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git ls-files -z '*.md' | xargs -0 docker run --rm --network none -v "$PWD:/workdir:ro" -w /workdir "$MARKDOWNLINT_IMAGE"

  links:
    name: Links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LYCHEE_IMAGE: docker.io/lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git ls-files -z '*.md' | xargs -0 docker run --rm --network none -v "$PWD:/input:ro" -w /input "$LYCHEE_IMAGE" --offline --include-fragments --no-progress

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="--full-history --diff-filter=tuxdb HEAD" --redact --no-banner --verbose .
