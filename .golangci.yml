version: "2"

linters:
  default: standard
  exclusions:
    rules:
      - linters: [errcheck]
        path: ^internal/mutate/
        source: '^\s*removeTree\('
  enable:
    - errorlint
    - misspell
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*os.Root).Close
        - (*compress/gzip.Reader).Close
        - os.Remove
        - os.RemoveAll
    errorlint:
      errorf: false
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1002
        - -S1011
        - -ST1005
