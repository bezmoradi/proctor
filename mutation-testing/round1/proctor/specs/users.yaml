# Written by Claude for the testing phase (2026-11-14); accepted under the
# product owner's testing-phase rule. Phase 0 subset: HTTP only.
version: 1
suite: users
scenarios:
  - id: PGU-001
    name: A created user can be read back as JSON
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: Ada } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: read
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          headers:
            Content-Type: application/json
          json:
            $.data.id: "${user_id}"
            $.data.name: Ada

  - id: PGU-002
    name: A user can't be created with an empty name
    steps:
      - id: create-empty
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: "" } }
        expect:
          status: 422
          json:
            $.error: Validation failed

  - id: PGU-003
    name: Reading a user that doesn't exist returns 404
    steps:
      - id: read-unknown
        request: { method: GET, path: /api/v1/users/2000000000, identity: admin }
        expect:
          status: 404
          json:
            $.error: Not found

  - id: PGU-004
    name: A rename is returned and persisted
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: Ada } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: rename
        request: { method: PUT, path: "/api/v1/users/${user_id}", identity: admin, body: { name: Grace } }
        expect:
          status: 200
          json:
            $.data.name: Grace
      - id: read
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $.data.name: Grace

  - id: PGU-005
    name: A deleted user can no longer be read
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: Ada } }
        expect: { status: 201 }
        save: { user_id: $.data }
      - id: delete
        request: { method: DELETE, path: "/api/v1/users/${user_id}", identity: admin }
        expect: { status: 200 }
    steps:
      - id: read-deleted
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect: { status: 404 }

  - id: PGU-006
    name: Renaming one user leaves another unchanged
    setup:
      - id: create-a
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: Ada } }
        expect: { status: 201 }
        save: { a_id: $.data }
      - id: create-b
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: Bob } }
        expect: { status: 201 }
        save: { b_id: $.data }
    steps:
      - id: rename-a
        request: { method: PUT, path: "/api/v1/users/${a_id}", identity: admin, body: { name: Grace } }
        expect:
          status: 200
          json:
            $.data.name: Grace
      - id: read-b
        request: { method: GET, path: "/api/v1/users/${b_id}", identity: admin }
        expect:
          status: 200
          json:
            $.data.name: Bob

  - id: PGU-007
    name: Deleting one user leaves another in place
    setup:
      - id: create-a
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: Ada } }
        expect: { status: 201 }
        save: { a_id: $.data }
      - id: create-b
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: Bob } }
        expect: { status: 201 }
        save: { b_id: $.data }
      - id: delete-a
        request: { method: DELETE, path: "/api/v1/users/${a_id}", identity: admin }
        expect: { status: 200 }
    steps:
      - id: read-b
        request: { method: GET, path: "/api/v1/users/${b_id}", identity: admin }
        expect:
          status: 200
          json:
            $.data.name: Bob

  - id: PGU-008
    name: Listing users without a token is refused
    steps:
      - id: list-anonymous
        request: { method: GET, path: /api/v1/users, identity: anonymous }
        expect:
          status: 401
          json:
            $.error: unauthorized

  - id: PGU-009
    name: An expired token is refused
    steps:
      - id: list-expired
        request: { method: GET, path: /api/v1/users, identity: expired }
        expect: { status: 401 }

  - id: PGU-010
    name: A token with a broken signature is refused
    steps:
      - id: list-tampered
        request: { method: GET, path: /api/v1/users, identity: tampered }
        expect: { status: 401 }

  - id: PGU-011
    name: An anonymous delete is refused and the user still exists
    setup:
      - id: create
        request: { method: POST, path: /api/v1/users, identity: admin, body: { name: Ada } }
        expect: { status: 201 }
        save: { user_id: $.data }
    steps:
      - id: delete-anonymous
        request: { method: DELETE, path: "/api/v1/users/${user_id}", identity: anonymous }
        expect: { status: 401 }
      - id: still-there
        request: { method: GET, path: "/api/v1/users/${user_id}", identity: admin }
        expect:
          status: 200
          json:
            $.data.name: Ada

  - id: PGU-012
    name: PATCH is not supported on a user
    steps:
      - id: patch
        request: { method: PATCH, path: /api/v1/users/1, identity: admin, body: { name: Z } }
        expect: { status: 405 }
